name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs uv (same version as the Dockerfile) and the Python version
      # pinned in .python-version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest -q
        env:
          # The tests run offline; keep Agno from sending usage telemetry.
          AGNO_TELEMETRY: "false"
