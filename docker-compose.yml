name: dango

services:
  web:
    image: ghcr.io/zhiro-labs/dango:latest
    entrypoint: []
    command: uv run uvicorn web.main:app --host 0.0.0.0 --port 17860
    environment:
      - WEB_PORT=17860
      # Extra hosts the dashboard may be opened at (loopback is always allowed).
      # See docs/advanced/vps.md before changing this or the port binding.
      # - WEB_ALLOWED_HOSTS=192.168.1.50
    ports:
      # Localhost only: the dashboard has no login. Docker-published ports
      # bypass host firewalls such as UFW, so "17860:17860" would be public.
      - "127.0.0.1:17860:17860"
    volumes:
      - ./data:/app/data           # config.yaml with secrets (auto-created on first run)
      - ./config:/app/config       # workspace_sys_prompt.txt (editable via Web GUI)
      - /var/run/docker.sock:/var/run/docker.sock  # bot start/stop/restart control
    restart: unless-stopped

  bot:
    image: ghcr.io/zhiro-labs/dango:latest
    volumes:
      - ./data:/app/data           # config.yaml written by Web GUI
      - ./config:/app/config       # chat_sys_prompt.txt, runtime.yml (auto-created on first run)
      - fonts:/app/assets/fonts    # font cache (~100 MB, persists across restarts)
      - ./workspace:/app/workspace  # workspace files (enable in Web GUI to activate)
      - ./skills:/app/skills        # skills (enable in Web GUI; templates seeded on first run)
      - ./custom:/app/custom        # custom commands & tools (.example templates seeded on first run)
    restart: unless-stopped

volumes:
  fonts:
