name: dango

services:
  web:
    build: .
    entrypoint: []
    command: uv run uvicorn web.main:app --host 0.0.0.0 --port 17860
    environment:
      - WEB_PORT=17860
    ports:
      # Localhost only: the dashboard has no login. Docker-published ports
      # bypass host firewalls such as UFW, so "17860:17860" would be public.
      - "127.0.0.1:17860:17860"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  bot:
    build: .
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - fonts:/app/assets/fonts
      - ./workspace:/app/workspace
      - ./skills:/app/skills
      - ./custom:/app/custom
    restart: unless-stopped

volumes:
  fonts:
